<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Switch - Open contact style -->
  <g stroke="#8b4513" stroke-width="3" stroke-linecap="round">
    <!-- Lead lines -->
    <line x1="4" y1="32" x2="20" y2="32" fill="none"/>
    <line x1="44" y1="32" x2="60" y2="32" fill="none"/>
    <!-- Contact points -->
    <circle cx="20" cy="32" r="3" fill="#b87333" stroke="#b87333"/>
    <circle cx="44" cy="32" r="3" fill="none" stroke="#b87333"/>
    <!-- Lever (open position) -->
    <line x1="20" y1="32" x2="42" y2="18" stroke="#b87333" stroke-width="3"/>
  </g>
</svg>
