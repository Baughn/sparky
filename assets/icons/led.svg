<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LED - Diode with light rays -->
  <g stroke="#8b4513" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lead lines -->
    <line x1="4" y1="38" x2="20" y2="38" fill="none"/>
    <line x1="44" y1="38" x2="60" y2="38" fill="none"/>
    <!-- Triangle (anode side) -->
    <polygon points="20,26 20,50 40,38" fill="none" stroke="#b87333"/>
    <!-- Bar (cathode side) -->
    <line x1="40" y1="24" x2="40" y2="52" stroke="#b87333" stroke-width="4"/>
    <!-- Light rays -->
    <line x1="28" y1="20" x2="24" y2="8" stroke="#b87333" stroke-width="2"/>
    <polyline points="22,12 24,8 28,10" fill="none" stroke="#b87333" stroke-width="2"/>
    <line x1="36" y1="18" x2="40" y2="6" stroke="#b87333" stroke-width="2"/>
    <polyline points="38,10 40,6 44,8" fill="none" stroke="#b87333" stroke-width="2"/>
  </g>
</svg>
