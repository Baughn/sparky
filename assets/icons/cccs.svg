<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- CCCS - Current-Controlled Current Source (diamond with sensing and arrow) -->
  <g stroke="#8b4513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Control input leads (top/bottom - current sensing) -->
    <line x1="32" y1="4" x2="32" y2="14" fill="none"/>
    <line x1="32" y1="50" x2="32" y2="60" fill="none"/>
    <!-- Sensing arrow on input -->
    <polyline points="28,8 32,4 36,8" fill="none" stroke="#2c2c2c" stroke-width="2"/>
    <!-- Output leads (left/right) -->
    <line x1="4" y1="32" x2="14" y2="32" fill="none"/>
    <line x1="50" y1="32" x2="60" y2="32" fill="none"/>
    <!-- Diamond -->
    <polygon points="32,14 50,32 32,50 14,32" fill="none" stroke="#b87333" stroke-width="3"/>
    <!-- Arrow pointing right (current output) -->
    <line x1="22" y1="32" x2="42" y2="32" stroke="#2c2c2c" stroke-width="2"/>
    <polyline points="38,28 42,32 38,36" fill="none" stroke="#2c2c2c" stroke-width="2"/>
  </g>
</svg>
