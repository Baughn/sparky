<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Motor - Circle with M -->
  <g stroke="#8b4513" stroke-width="3" stroke-linecap="round">
    <!-- Lead lines -->
    <line x1="4" y1="32" x2="14" y2="32" fill="none"/>
    <line x1="50" y1="32" x2="60" y2="32" fill="none"/>
    <!-- Motor circle -->
    <circle cx="32" cy="32" r="18" fill="none" stroke="#b87333"/>
    <!-- M label -->
    <text x="32" y="38" font-family="Arial" font-size="18" font-weight="bold" fill="#2c2c2c" text-anchor="middle">M</text>
  </g>
</svg>
