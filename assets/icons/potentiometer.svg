<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Potentiometer - Resistor with arrow -->
  <g fill="none" stroke="#8b4513" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lead lines -->
    <line x1="4" y1="38" x2="12" y2="38"/>
    <line x1="52" y1="38" x2="60" y2="38"/>
    <!-- Zigzag body -->
    <polyline points="12,38 16,28 24,48 32,28 40,48 48,28 52,38" stroke="#b87333"/>
    <!-- Arrow (wiper) -->
    <line x1="32" y1="4" x2="32" y2="28" stroke="#b87333" stroke-width="2"/>
    <polyline points="28,16 32,28 36,16" fill="none" stroke="#b87333" stroke-width="2"/>
  </g>
</svg>
